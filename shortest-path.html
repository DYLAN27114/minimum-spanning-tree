<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport"="width=device-width, initial-scale=1">
  <title>A 到 F 最短路徑</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111f;
      --panel: #111c2e;
      --line: #46566d;
      --text: #edf4ff;
      --muted: #9fb0c9;
      --accent: #4cc9f0;
      --chosen: #ffd166;
      --good: #58d68d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, #172b48 0, var(--bg) 55%);
      color: var(--text);
    }
    main { width: min(1120px, 94vw); margin: 0 auto; padding: 28px 0 40px; }
    h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 48px); }
    .subtitle { margin: 0 0 22px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; }
    .card {
      border: 1px solid #263a58;
      border-radius: 18px;
      background: rgba(17, 28, 46, .92);
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
    }
    #graphWrap { position: relative; min-height: 540px; overflow: hidden; }
    svg { width: 100%; height: 540px; display: block; }
    .edge { stroke: var(--line); stroke-width: 3; cursor: pointer; }
    .edge.selected { stroke: var(--chosen); stroke-width: 7; }
    .edge-label {
      fill: var(--text); font-weight: 800; font-size: 17px; paint-order: stroke;
      stroke: var(--panel); stroke-width: 7px; stroke-linejoin: round;
    }
    .node { fill: #1b3152; stroke: var(--accent); stroke-width: 4; }
    .node-text { fill: white; font-size: 25px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    aside { padding: 18px; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    label { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 6px; }
    input, select, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #355175;
      background: #0b1524;
      color: var(--text);
      padding: 11px;
      font: inherit;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      cursor: pointer;
      font-weight: 800;
      margin-top: 10px;
      border: none;
      background: var(--accent);
      color: #06111f;
    }
    button.secondary { background: #263b5a; color: var(--text); }
    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #091321;
      min-height: 92px;
    }
    ol { padding-left: 22px; line-height: 1.65; }
    #total { color: var(--good); font-size: 30px; font-weight: 900; }
    #path { color: var(--muted); line-height: 1.7; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      #graphWrap, svg { min-height: 430px; height: 430px; }
    }
  </style>
</head>
<body>
<main>
  <h1>A 到 F 最短路徑</h1>
  <p class="subtitle">每個點只與相鄰點連線。點位排列為 B 左上、C 右上、E 右下、D 左下，並以 Dijkstra 演算法計算 A 到 F 的最短路徑。</p>
  <div class="layout">
    <section class="card" id="graphWrap" aria-label="六點圖形">
      <svg id="graph" viewBox="0 0 760 540"></svg>
    </section>
    <aside class="card">
      <h2>設定與計算</h2>
      <label for="from">起點</label>
      <div class="row">
        <select id="from"></select>
        <select id="to"></select>
      </div>
      <label for="cost">相鄰兩點之間的 cost</label>
      <input id="cost" type="number" min="1" max="99" value="10">
      <button id="apply" type="button">套用成本並顯示</button>
      <button id="randomize" class="secondary" type="button">隨機產生所有 cost</button>
      <button id="calculate" type="button">計算最短路徑</button>
      <div id="result" aria-live="polite">
        <div>最短總成本</div>
        <div id="total">—</div>
        <div id="path">請先產生成本並計算。</div>
        <ol id="steps"><li>設定完成後按「計算最短路徑」。</li></ol>
      </div>
    </aside>
  </div>
</main>
<script>
const nodes = ['A', 'B', 'C', 'D', 'E', 'F'];
const positions = { A:[70,270], B:[280,150], C:[480,150], D:[280,390], E:[480,390], F:[690,270] };
const svg = document.getElementById('graph');
let edges = [];
let selectedEdge = new Set();
const adjacencyKeys = new Set([
  'A-B', 'A-D',
  'B-E',
  'E-C',
  'C-D',
  'B-D',
  'F-E', 'F-C'
].map(key => key.split('-').sort().join('-')));

for (const from of nodes) {
  document.getElementById('from').insertAdjacentHTML('beforeend', `<option>${from}</option>`);
  document.getElementById('to').insertAdjacentHTML('beforeend', `<option>${from}</option>`);
}
document.getElementById('to').value = 'B';

function makeEdges() {
  edges = [];
  const possible = ['A-B', 'A-D', 'B-E', 'E-C', 'C-D', 'B-D', 'F-E', 'F-C'];
  for (const pair of possible) {
    const [from, to] = pair.split('-');
    edges.push({ from, to, cost: Math.floor(Math.random() * 20) + 1 });
  }
  draw();
}

function setEdges() {
  edges = [];
  const possible = ['A-B', 'A-D', 'B-E', 'E-C', 'C-D', 'B-D', 'F-E', 'F-C'];
  for (const pair of possible) {
    const [from, to] = pair.split('-');
    edges.push({ from, to, cost: Math.floor(Math.random() * 20) + 1 });
  }
}

function edgeKey(a, b) { return [a, b].sort().join('-'); }

function dijkstra() {
  const distances = Object.fromEntries(nodes.map(node => [node, Infinity]));
  const previous = {};
  distances.A = 0;
  const unvisited = new Set(nodes);
  const steps = ['從起點 A 開始，令 A = 0，其餘點為∞。'];

  while (unvisited.size) {
    const current = [...unvisited].sort((a, b) => distances[a] - distances[b])[0];
    if (!Number.isFinite(distances[current])) break;
    unvisited.delete(current);
    if (current === 'F') break;

    for (const edge of edges) {
      if (edge.from !== current && edge.to !== current) continue;
      const neighbor = edge.from === current ? edge.to : edge.from;
      if (!unvisited.has(neighbor)) continue;
      const candidate = distances[current] + edge.cost;
      if (candidate < distances[neighbor]) {
        distances[neighbor] = candidate;
        previous[neighbor] = current;
        steps.push(`${current} → ${neighbor}：${distances[current]} + ${edge.cost} = ${candidate}，更新為 ${candidate}。`);
      }
    }
  }

  const route = [];
  let current = 'F';
  while (current) {
    route.unshift(current);
    if (current === 'A') break;
    current = previous[current];
  }
  if (!Number.isFinite(distances.F)) {
    document.getElementById('total').textContent = '∞';
    document.getElementById('path').textContent = 'A 無法到達 F。';
    document.getElementById('steps').innerHTML = '';
    return;
  }
  selectedEdge = new Set(route.slice(0, -1).map((node, index) => edgeKey(node, route[index + 1])));
  document.getElementById('total').textContent = distances.F;
  document.getElementById('path').textContent = `最短路徑：${route.join(' → ')}`;
  steps.push(`到達 F：A 到 F 的最短成本為 ${distances.F}，路徑為 ${route.join(' → ')}。`);
  document.getElementById('steps').innerHTML = steps.map(step => `<li>${step}</li>`).join('');
  draw();
}

function draw() {
  svg.innerHTML = '';
  for (const edge of edges) {
    const [x1, y1] = positions[edge.from];
    const [x2, y2] = positions[edge.to];
    const key = edgeKey(edge.from, edge.to);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', `edge${selectedEdge.has(key) ? ' selected' : ''}`);
    svg.appendChild(line);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', (x1 + x2) / 2);
    text.setAttribute('y', (y1 + y2) / 2 - 9);
    text.setAttribute('class', 'edge-label');
    text.setAttribute('text-anchor', 'middle');
    text.textContent = edge.cost;
    svg.appendChild(text);
  }
  for (const node of nodes) {
    const [x, y] = positions[node];
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', 31);
    circle.setAttribute('class', 'node');
    svg.appendChild(circle);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x); text.setAttribute('y', y);
    text.setAttribute('class', 'node-text');
    text.textContent = node;
    svg.appendChild(text);
  }
}

function calculate() { dijkstra(); }

document.getElementById('apply').addEventListener('click', () => {
  const from = document.getElementById('from').value;
  const to = document.getElementById('to').value;
  const cost = Number(document.getElementById('cost').value);
  if (from === to || !Number.isInteger(cost) || cost < 1) {
    alert('請選擇不同的兩點，並輸入正整數 cost。');
    return;
  }
  const edge = edges.find(item => edgeKey(item.from, item.to) === edgeKey(from, to));
  if (!edge || !adjacencyKeys.has(edgeKey(from, to))) {
    alert('A、B、C、D、E、F 之間只能修改相鄰的線。');
    return;
  }
  edge.cost = cost;
  selectedEdge.clear();
  document.getElementById('total').textContent = '—';
  document.getElementById('path').textContent = '成本已更新，請重新計算。';
  document.getElementById('steps').innerHTML = '<li>成本已更新，請重新計算最短路徑。</li>';
  draw();
});
document.getElementById('randomize').addEventListener('click', () => {
  makeEdges();
  selectedEdge.clear();
  document.getElementById('total').textContent = '—';
  document.getElementById('path').textContent = '已隨機產生成本，請開始計算。';
});
document.getElementById('calculate').addEventListener('click', calculate);
makeEdges();
</script>
</body>
</html>
