<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kruskal 最小生成樹示範</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111f;
      --panel: #111c2e;
      --line: #46566d;
      --text: #edf4ff;
      --muted: #9fb0c9;
      --accent: #4cc9f0;
      --chosen: #ffd166;
      --rejected: #f07178;
      --good: #58d68d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, #172b48 0, var(--bg) 55%);
      color: var(--text);
    }
    main { width: min(1120px, 94vw); margin: 0 auto; padding: 28px 0 40px; }
    h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 48px); }
    h2 { margin: 0 0 14px; font-size: 20px; }
    .subtitle { margin: 0 0 22px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; }
    .card {
      border: 1px solid #263a58;
      border-radius: 18px;
      background: rgba(17, 28, 46, .92);
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
    }
    #graphWrap { min-height: 540px; overflow: hidden; }
    svg { width: 100%; height: 540px; display: block; }
    .edge { stroke: var(--line); stroke-width: 3; transition: stroke .2s, stroke-width .2s; }
    .edge.current { stroke: var(--accent); stroke-width: 6; }
    .edge.chosen { stroke: var(--chosen); stroke-width: 7; }
    .edge.rejected { stroke: var(--rejected); stroke-width: 4; stroke-dasharray: 8 6; }
    .edge-label {
      fill: var(--text); font-weight: 800; font-size: 17px; paint-order: stroke;
      stroke: var(--panel); stroke-width: 7px; stroke-linejoin: round;
    }
    .node { fill: #1b3152; stroke: var(--accent); stroke-width: 4; }
    .node-text {
      fill: white; font-size: 25px; font-weight: 800; text-anchor: middle;
      dominant-baseline: middle;
    }
    aside { padding: 18px; }
    .legend { color: var(--muted); font-size: 14px; line-height: 1.8; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      margin-top: 10px;
      padding: 12px;
      background: var(--accent);
      color: #06111f;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button.secondary { background: #263b5a; color: var(--text); }
    button:disabled { cursor: not-allowed; opacity: .6; }
    #status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #091321;
      min-height: 88px;
      line-height: 1.65;
    }
    #total { color: var(--good); font-size: 30px; font-weight: 900; }
    .table-wrap { margin-top: 18px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #263a58; }
    th { color: var(--muted); font-size: 13px; }
    td:last-child { color: var(--muted); }
    .accepted { color: var(--chosen) !important; font-weight: 800; }
    .skipped { color: var(--rejected) !important; font-weight: 800; }
    .footer-link { display: inline-block; margin-top: 18px; color: var(--accent); }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      #graphWrap, svg { min-height: 430px; height: 430px; }
    }
  </style>
</head>
<body>
<main>
  <h1>Kruskal 最小生成樹</h1>
  <p class="subtitle">依照老師指定的六個頂點與九條固定成本邊，逐步示範 Kruskal 演算法。總成本應為 13。</p>
  <div class="layout">
    <section class="card" id="graphWrap" aria-label="固定成本加權圖">
      <svg id="graph" viewBox="0 0 760 540" role="img" aria-label="頂點 A 至 F 與九條固定成本邊"></svg>
    </section>
    <aside class="card">
      <h2>操作說明</h2>
      <p class="legend">依成本由小到大檢查邊。若加入該邊不會形成環，就把它加入生成樹；否則略過。連通六個頂點需要選出 5 條邊。</p>
      <button id="next" type="button">檢查下一條邊</button>
      <button id="reset" class="secondary" type="button">重新示範</button>
      <div id="status" aria-live="polite">
        <div id="message">按下「檢查下一條邊」，開始從成本最小的邊示範。</div>
        <div>目前生成樹成本</div>
        <div id="total">0</div>
        <div id="edgeCount">已選 0 / 5 條邊</div>
      </div>
    </aside>
  </div>

  <section class="card table-wrap" aria-label="Kruskal 計算過程">
    <table>
      <thead>
        <tr><th>順序</th><th>邊</th><th>成本</th><th>處理結果</th></tr>
      </thead>
      <tbody id="steps"></tbody>
    </table>
  </section>
  <a class="footer-link" href="./shortest-path.html">前往 A 到 F 最短路徑作業</a>
</main>
<script>
const nodes = ['A', 'B', 'C', 'D', 'E', 'F'];
const positions = {
  A: [75, 270], B: [255, 130], C: [255, 410],
  D: [455, 270], E: [640, 130], F: [680, 410]
};
const edges = [
  { from: 'A', to: 'B', cost: 4 },
  { from: 'A', to: 'C', cost: 2 },
  { from: 'B', to: 'C', cost: 1 },
  { from: 'B', to: 'D', cost: 5 },
  { from: 'C', to: 'D', cost: 8 },
  { from: 'C', to: 'E', cost: 10 },
  { from: 'D', to: 'E', cost: 2 },
  { from: 'D', to: 'F', cost: 6 },
  { from: 'E', to: 'F', cost: 3 }
];
const sortedEdges = [...edges].sort((a, b) => a.cost - b.cost);
const svg = document.getElementById('graph');
const stepsBody = document.getElementById('steps');
const parent = Object.fromEntries(nodes.map(node => [node, node]));
let nextEdge = 0;
let total = 0;
let selectedCount = 0;
const lineElements = new Map();

function edgeKey(edge) {
  return [edge.from, edge.to].sort().join('-');
}

function find(node) {
  if (parent[node] !== node) parent[node] = find(parent[node]);
  return parent[node];
}

function drawGraph() {
  for (const edge of edges) {
    const [x1, y1] = positions[edge.from];
    const [x2, y2] = positions[edge.to];
    const key = edgeKey(edge);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('class', 'edge');
    svg.appendChild(line);
    lineElements.set(key, line);

    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', (x1 + x2) / 2);
    label.setAttribute('y', (y1 + y2) / 2 - 9);
    label.setAttribute('class', 'edge-label');
    label.setAttribute('text-anchor', 'middle');
    label.textContent = edge.cost;
    svg.appendChild(label);
  }

  for (const node of nodes) {
    const [x, y] = positions[node];
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', x);
    circle.setAttribute('cy', y);
    circle.setAttribute('r', 30);
    circle.setAttribute('class', 'node');
    svg.appendChild(circle);
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', x);
    label.setAttribute('y', y);
    label.setAttribute('class', 'node-text');
    label.textContent = node;
    svg.appendChild(label);
  }
}

function finish() {
  document.getElementById('message').textContent =
    `完成！選入 ${selectedCount} 條邊，最小生成樹總成本為 ${total}。剩餘邊不必檢查，因為六個頂點已連通。`;
  document.getElementById('next').disabled = true;
}

function processNextEdge() {
  if (nextEdge >= sortedEdges.length || selectedCount === nodes.length - 1) return;

  const edge = sortedEdges[nextEdge];
  const key = edgeKey(edge);
  const fromRoot = find(edge.from);
  const toRoot = find(edge.to);
  const row = document.createElement('tr');
  const decision = document.createElement('td');

  if (fromRoot === toRoot) {
    decision.textContent = '略過：會形成環';
    decision.className = 'skipped';
    document.getElementById('message').textContent =
      `檢查 ${edge.from}–${edge.to}（成本 ${edge.cost}）：兩點已連通，加入會形成環，因此略過。`;
  } else {
    parent[toRoot] = fromRoot;
    selectedCount++;
    total += edge.cost;
    decision.textContent = '加入最小生成樹';
    decision.className = 'accepted';
    document.getElementById('message').textContent =
      `檢查 ${edge.from}–${edge.to}（成本 ${edge.cost}）：不會形成環，加入生成樹。`;
  }

  const orderCell = document.createElement('td');
  orderCell.textContent = String(nextEdge + 1);
  const edgeCell = document.createElement('td');
  edgeCell.textContent = `${edge.from}–${edge.to}`;
  const costCell = document.createElement('td');
  costCell.textContent = String(edge.cost);
  row.append(orderCell, edgeCell, costCell, decision);
  stepsBody.appendChild(row);
  lineElements.get(key).setAttribute('class', `edge ${fromRoot === toRoot ? 'rejected' : 'chosen'}`);
  nextEdge++;

  const next = sortedEdges[nextEdge];
  if (next && selectedCount < nodes.length - 1) {
    lineElements.get(edgeKey(next)).setAttribute('class', 'edge current');
  }
  document.getElementById('total').textContent = String(total);
  document.getElementById('edgeCount').textContent = `已選 ${selectedCount} / 5 條邊`;

  if (selectedCount === nodes.length - 1) finish();
}

function resetDemo() {
  for (const node of nodes) parent[node] = node;
  nextEdge = 0;
  total = 0;
  selectedCount = 0;
  stepsBody.replaceChildren();
  for (const line of lineElements.values()) line.setAttribute('class', 'edge');
  lineElements.get(edgeKey(sortedEdges[0])).setAttribute('class', 'edge current');
  document.getElementById('message').textContent =
    '按下「檢查下一條邊」，開始從成本最小的邊示範。';
  document.getElementById('total').textContent = '0';
  document.getElementById('edgeCount').textContent = '已選 0 / 5 條邊';
  document.getElementById('next').disabled = false;
}

document.getElementById('next').addEventListener('click', processNextEdge);
document.getElementById('reset').addEventListener('click', resetDemo);
drawGraph();
resetDemo();
</script>
</body>
</html>
